<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dr. Strange Web Hand Tracking</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
    #video_input { display: none; }
    
    /* The Canvas where the video and hand lines are drawn */
    #output_canvas {
      transform: scaleX(-1); /* Mirror effect */
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    /* The Spell Circle Container */
    #spell-container {
      position: absolute;
      width: 300px;
      height: 300px;
      pointer-events: none;
      display: none; /* Hidden until hand is detected */
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    /* Glow and Rings */
    .ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 140, 0, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 15px #ff4500, inset 0 0 15px #ff4500;
    }

    .outer {
      width: 280px; height: 280px;
      border-style: double;
      border-width: 6px;
      animation: rotate 10s linear infinite;
    }

    .middle {
      width: 200px; height: 200px;
      border: 3px dashed #ffae00;
      animation: rotate 5s linear infinite reverse;
    }

    .inner {
      width: 120px; height: 120px;
      border: 2px solid #fffb00;
      animation: rotate 2s linear infinite;
    }

    @keyframes rotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .status {
      position: absolute;
      top: 10px; left: 10px;
      color: #ff8c00;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <div class="status">Initializing Eldritch Magic...</div>
  <video id="video_input"></video>
  <canvas id="output_canvas"></canvas>

  <div id="spell-container">
    <div class="ring outer"></div>
    <div class="ring middle"></div>
    <div class="ring inner"></div>
  </div>

  <script type="module">
    const videoElement = document.getElementById('video_input');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const spell = document.getElementById('spell-container');

    function onResults(results) {
      // Clear and draw the video frame
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        // We track the first hand detected
        const hand = results.multiHandLandmarks[0];
        
        // Landmark 9 is the middle of the palm
        const palm = hand[9]; 
        
        // Convert normalized coordinates (0-1) to screen pixels
        // We flip X because the canvas is mirrored
        const x = (1 - palm.x) * window.innerWidth;
        const y = palm.y * window.innerHeight;

        // Position the spell
        spell.style.display = 'block';
        spell.style.left = `${x}px`;
        spell.style.top = `${y}px`;

        // Optional: Scale spell based on hand distance (Z-axis)
        const scale = 1 + Math.abs(palm.z) * 5; 
        spell.style.transform = `translate(-50%, -50%) scale(${scale})`;
      } else {
        spell.style.display = 'none';
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    camera.start();
    
    document.querySelector('.status').innerText = "Magic Ready: Show your hand";
  </script>
</body>
</html>
